<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5fa;--card:#fff;--tx:#1a2233;--mu:#68718a;--bd:#e2e6f0;--pe:#e4e8f1;--ok:#16a34a;--nt:#f59e0b;--ac:#2563eb;--er:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#ececec;--mu:#a0a0a0;--bd:#333;--pe:#333;--ok:#22c55e;--nt:#fbbf24;--ac:#60a5fa;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#ececec;--mu:#a0a0a0;--bd:#333;--pe:#333;--ok:#22c55e;--nt:#fbbf24;--ac:#60a5fa;--er:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;max-width:900px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
.wt{flex:none;color:var(--tx)}.wt .rot{transform-origin:20px 14px;animation:giro 4s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wt .rot{animation:none}}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--bd);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mu)}
.pill.ok i{background:var(--ok)}.pill.sy i{background:var(--nt);animation:pu 1s infinite}.pill.of i,.pill.er i{background:var(--er)}
@keyframes pu{50%{opacity:.3}}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:600}
.banner.of{background:color-mix(in srgb,var(--er) 15%,transparent);border:1px solid var(--er);color:var(--er)}
.banner.sy{background:color-mix(in srgb,var(--nt) 15%,transparent);border:1px solid var(--nt);color:var(--nt)}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--bd);margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:9px 1px;border-radius:10px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px}
.ring b small{font-size:12px;color:var(--mu);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-width:220px}
.kpi{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.row .n{width:112px;flex:none;font-weight:600}
.bar{flex:1;height:14px;background:var(--pe);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s}
.row .p{width:40px;text-align:right;color:var(--mu)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:10px}
.legend s{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;text-decoration:none}
.map{overflow:auto;border:1px solid var(--bd);border-radius:12px;max-height:70vh}
.g{display:grid;grid-template-columns:38px repeat(22,var(--cs));gap:2px;padding:4px;width:max-content}
.h{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:700;height:78px;color:var(--mu);text-align:left;position:sticky;top:0;background:var(--card);z-index:1}
.l{font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;position:sticky;left:0;background:var(--card);z-index:1}
.c{width:26px;height:26px;border-radius:6px;border:0;background:var(--pe);padding:0;font-size:12px;color:#fff;cursor:pointer;position:relative}
.c.d{background:var(--ok)}.c.n{background:transparent;border:2px solid var(--nt);color:var(--nt);font-size:10px}
.c.p::after,.chip.p::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--nt);border:2px solid var(--card)}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.w{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-family:inherit;color:var(--tx)}
.w.on{border-color:var(--ac)}.w b{font-size:16px;display:block}.w span{font-size:12px;color:var(--mu)}
.w .bar{height:8px;margin:6px 4px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;border:0;border-radius:20px;padding:8px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer;background:var(--pe);color:var(--tx)}
.chip.d{background:var(--ok);color:#fff}.chip.n{background:transparent;border:2px solid var(--nt);color:var(--nt)}
.ro .c,.ro .chip{cursor:default}
.btn{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.btn.dg{border-color:var(--er);color:var(--er)}
.hi{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.hi:last-child{border:0}.hi .t{color:var(--mu);font-size:11px}.hi>div{flex:1}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--er);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:9;max-width:90vw;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:380px;width:100%}
.modal input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:10px 0}
.modal code{display:block;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px;font-size:12px;margin:6px 0}
.card textarea,.card input#aw{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:0 0 10px;resize:vertical}
.card select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:0 0 10px}
.card input.pi{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:0 0 10px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.ad{font-weight:700;font-size:13px;text-transform:capitalize;margin:14px 0 6px;color:var(--ac)}
.ae{padding:9px 0;border-bottom:1px solid var(--bd)}.ae:last-child{border:0}.ae .t{color:var(--mu);font-size:12px;margin-bottom:3px}
.atx{white-space:pre-wrap;word-break:break-word;font-size:14px}
.big{padding:13px 16px;font-size:15px}
.tl{margin:0 0 10px;font-size:13px}
.hero2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.l{flex-direction:column;line-height:1}.l small{font-size:8px;color:var(--mu);font-weight:600;margin-top:1px}
.h{cursor:pointer}.h.on{color:var(--ac)}
.age{font-size:11px;font-weight:700;border-radius:8px;padding:1px 6px;margin-left:4px;border:1px solid currentColor}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:9px 12px;white-space:nowrap}
.wx{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:520px){.wx{grid-template-columns:1fr}}
.wxs{width:100%;border-radius:12px;background:linear-gradient(var(--wk1),var(--wk2));display:block}
:root{--wk1:#bfdbfe;--wk2:#e0f2fe}:root[data-theme=dark]{--wk1:#0b1220;--wk2:#16233b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--wk1:#0b1220;--wk2:#16233b}}
.streak{stroke:var(--ac);stroke-width:2;stroke-linecap:round;fill:none;stroke-dasharray:18 90;opacity:.55;animation:strk var(--d,3s) linear infinite}
@keyframes strk{from{stroke-dashoffset:108}to{stroke-dashoffset:0}}
.rotor{transform-origin:130px 52px;animation:giro var(--r,4s) linear infinite}
.drop{stroke:#60a5fa;stroke-width:1.6;stroke-linecap:round;animation:cae .7s linear infinite}
@keyframes cae{from{transform:translateY(-20px)}to{transform:translateY(150px)}}
.cmp{width:118px;height:118px}.cmp .ar{transform-origin:60px 60px;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1)}
.cmp .sw{transform-origin:60px 60px;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}0%,100%{transform:rotate(-5deg)}}
.big-n{font-size:34px;font-weight:800;line-height:1}.big-n small{font-size:14px;font-weight:600;color:var(--mu)}
.lv{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;font-weight:700;font-size:12px;color:#fff}
.hr{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px}
.hc{flex:none;width:46px;text-align:center;font-size:11px;color:var(--mu)}
.hc b{display:block;font-size:13px;color:var(--tx)}
.hc .vb{height:46px;display:flex;align-items:flex-end;justify-content:center}.hc .vb i{display:block;width:16px;border-radius:5px 5px 2px 2px;transition:height .6s}
.hc svg{width:18px;height:18px;transition:transform 1s}
.fl{animation:flot 3s ease-in-out infinite;display:inline-block}@keyframes flot{50%{transform:translateY(-4px)}}
.nw{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.nw:last-child{border:0}
.nw .e{font-size:20px;flex:none;width:26px;text-align:center}.nw .t{color:var(--mu);font-size:12px}
@media (prefers-reduced-motion:reduce){.streak,.rotor,.drop,.cmp .sw,.fl{animation:none}}

/* ===== Versión visual: tarjetas plegables, minis y escritorio ===== */
:root{--cs:26px;--g1:#2563eb;--g2:#7c3aed;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06)}
:root[data-theme=dark]{--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--g1:#3b82f6;--g2:#a78bfa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--g1:#3b82f6;--g2:#a78bfa}}
.card{box-shadow:var(--sh);transition:box-shadow .2s,transform .2s}
h1{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .wt{color:var(--tx)}
.tabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 12px rgba(37,99,235,.35)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--g1) 20%,var(--card)),color-mix(in srgb,var(--g2) 14%,var(--card)));border-color:color-mix(in srgb,var(--g1) 30%,var(--bd))}
.ring b{background:none}.ring svg circle:nth-child(2){filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 55%,transparent));transition:stroke-dasharray 1s ease}
.kpi{border:1px solid var(--bd);background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(4px)}
.kpi b{font-size:26px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi b[style*="--ok"]{background:none;color:var(--ok)!important}
.bar i{background-image:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.28));animation:grow .8s ease both}
@keyframes grow{from{width:0}}
.tb{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}
.cx{padding:0;overflow:hidden}
.cx>header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;flex-wrap:wrap}
.cx .ct{font-weight:700;font-size:15px;flex:1 1 150px;min-width:0}
.cx .mini{display:flex;align-items:center;gap:8px;flex:0 1 auto;font-size:12px;color:var(--mu);max-width:100%}
.cx .mini svg{display:block}
.cx .mini .mn{white-space:nowrap}
.bd{display:inline-block;border-radius:20px;padding:2px 9px;font-weight:800;font-size:12px;color:#fff;white-space:nowrap}
.cx .chev{font-style:normal;color:var(--mu);transition:transform .3s;transform:rotate(180deg);flex:none;font-weight:700;margin-left:auto}
.cx.open .chev{transform:rotate(0)}
.cx>header:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.cx .cb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.cx.open .cb{grid-template-rows:1fr}
.cx .ci{overflow:hidden;min-height:0}.cx .ip{padding:2px 14px 14px;border-top:1px solid var(--bd)}
.cx:not(.open) .ip{visibility:hidden}.cx .ip{transition:visibility .35s}
.gr>.card,.two>.card,.two>section{margin-bottom:14px}
@media (min-width:900px){
 body{max-width:min(1700px,96vw);padding:20px 32px}
 :root{--cs:34px}
 h1{font-size:26px}
 .tabs{max-width:900px;margin-left:auto;margin-right:auto}.tabs button{font-size:14px;padding:11px 8px}
 .gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:0 16px;align-items:start}
 .gr>.wide{grid-column:1/-1}
 .two{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:0 16px;align-items:start}
 .card:hover{transform:translateY(-1px)}
 .hero{padding:22px 28px;gap:30px}.ring{width:190px;height:190px}.ring svg{width:190px;height:190px}.ring b{font-size:40px}
 .kpis{grid-template-columns:repeat(3,minmax(120px,1fr));gap:14px}.kpi{padding:16px}.kpi b{font-size:34px}
 .map{max-height:76vh}.h{height:92px;font-size:11px}.wg{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

}
@media (min-width:1500px){.gr{grid-template-columns:repeat(auto-fit,minmax(520px,1fr))}}
.c{width:var(--cs);height:var(--cs)}
.pan{max-height:520px}
@media print{.tb{display:none}}

/* ===== Estilo "centro de control": paneles densos, sin espacios muertos ===== */
:root{--bg:#eef2f9;--card:#ffffff;--bd:#dde3ef;--pe:#e3e8f2;--g1:#0ea5e9;--g2:#8b5cf6}
:root[data-theme=dark]{--bg:#070b16;--card:#101729;--bd:#1f2a44;--pe:#1c2740;--tx:#e8edf9;--mu:#8b97b5;--g1:#22d3ee;--g2:#a78bfa;--ac:#38bdf8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070b16;--card:#101729;--bd:#1f2a44;--pe:#1c2740;--tx:#e8edf9;--mu:#8b97b5;--g1:#22d3ee;--g2:#a78bfa;--ac:#38bdf8}}
body{background:radial-gradient(1200px 500px at 10% -10%,color-mix(in srgb,var(--g1) 12%,transparent),transparent),radial-gradient(900px 500px at 100% 0,color-mix(in srgb,var(--g2) 12%,transparent),transparent),var(--bg);background-attachment:fixed;font-variant-numeric:tabular-nums}

.tile:hover{border-color:var(--g1);box-shadow:0 6px 22px color-mix(in srgb,var(--g1) 18%,transparent);transform:translateY(-1px)}
.tt{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.tt i{font-style:normal;opacity:.55;font-size:12px}
.tc{flex:1;min-height:0;display:flex;flex-direction:column}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.r0{min-height:0}.r1{min-height:200px}.r2{min-height:440px}.r3{min-height:250px}.r4{min-height:240px}.rw{min-height:500px}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.ctr.row2{flex-direction:row;gap:12px;justify-content:flex-start}
.ringbox{width:min(100%,170px)}
.kq{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kq>div{background:color-mix(in srgb,var(--pe) 55%,transparent);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.kq b{font-size:28px;line-height:1;font-weight:800}.kq b small{font-size:13px;color:var(--mu);font-weight:600}.kq span{font-size:11px;color:var(--mu);margin-top:2px}
.big2{font-size:38px;font-weight:800;line-height:1;margin-bottom:4px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}.big2 small{font-size:11px;color:var(--mu);-webkit-text-fill-color:var(--mu);font-weight:600}
.gv{font-size:30px;font-weight:800;line-height:1;margin-top:-4px}.gv small{font-size:12px;color:var(--mu);font-weight:600}.gs{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}
.lg{display:flex;flex-direction:column;gap:3px;font-size:12px}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.cols{flex:1;display:flex;gap:4px;align-items:stretch;min-height:90px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.col em{font-style:normal;font-size:9px;color:var(--mu);height:11px;line-height:11px}.col b{font-size:9px;color:var(--mu);font-weight:700}
.col .trk{flex:1;width:100%;max-width:26px;background:var(--pe);border-radius:5px;position:relative;overflow:hidden}

.hw{font-size:9px;color:var(--mu);text-align:center;font-weight:700}.hl{font-size:9.5px;font-weight:700;color:var(--mu);text-align:right;padding-right:6px;align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:3px}
.hr2{flex:1;display:grid;grid-template-columns:86px 1fr 52px;gap:8px;align-items:center;font-size:11.5px;min-height:15px}

</style></head><body>
<div class="top">
 <div><h1><svg class="wt" viewBox="0 0 40 44" width="34" height="38" aria-hidden="true"><polygon points="19,15 21,15 22.6,42 17.4,42" fill="currentColor" opacity=".85"/><g class="rot"><path d="M20 14 L18.7 1.5 Q20 -0.3 21.3 1.5 Z" fill="var(--ac)"/><path d="M20 14 L18.7 1.5 Q20 -0.3 21.3 1.5 Z" fill="var(--ac)" transform="rotate(120 20 14)"/><path d="M20 14 L18.7 1.5 Q20 -0.3 21.3 1.5 Z" fill="var(--ac)" transform="rotate(240 20 14)"/></g><circle cx="20" cy="14" r="2.3" fill="currentColor"/></svg> Avance de Commissioning</h1><div class="sub" id="meta">PE Olavarria PCR · EnVentus V162 Mk0C 6.4 MW · 22 WTG × 22 sistemas</div></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="pill" id="st"><i></i><span>Conectando…</span></span><button class="btn" id="thm" onclick="toggleTheme()" title="Modo claro / nocturno">🌙</button><button class="btn" id="usr" onclick="openUser()">👤</button></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDoc,getDocs,onSnapshot,runTransaction,writeBatch,serverTimestamp,query,orderBy,limit,where,getDocFromServer} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const BASE=["PITCH","QM1","ACUMUL","LOAD SEN","SWITCHGEAR","TRAFO","YAW MOTOR","SOFTWARE","RtoP","ENERG","COOLAN","HYD+GBX","ODM","CISCO 2/2","CMS","AV. L","CALIB BLD","T. LOAD","HT FREQ","1ET KILO","BATERÍA TEST","WIND SENSOR","MUESTRAS DE ACEITE"];
let S=[...BASE],NS=S.length;
const NW=29,PROJ=["projects","parque"];
const K=(w,s)=>String(w).padStart(2,"0")+"-"+s;   // id del documento: "05-1" = WTG 05, sistema 1 (PITCH)
const pad=n=>String(n).padStart(2,"0");
const $=id=>document.getElementById(id);
try{const t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
window.toggleTheme=()=>{const n=isDark()?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("tema",n)}catch(e){}render(true)};

/* ---------- Datos originales de la pizarra (se cargan UNA sola vez en la nube) ---------- */
function seedData(){
 const D={},N={};
 [2,3,4,5,6,7,8,11,12,13,14,15,16].forEach(s=>D[K(1,s)]=1);
 for(let w=7;w<=18;w++)for(let s=1;s<=20;s++)D[K(w,s)]=1;
 [15,16,17].forEach(w=>delete D[K(w,7)]);
 delete D[K(10,16)];
 Object.assign(N,{[K(15,7)]:"xOFFSET",[K(16,7)]:"xOFFSET",[K(17,7)]:"xOFFSET",[K(10,16)]:"(+)",[K(4,6)]:"FLEX CONT",[K(6,4)]:"2 LOAD = 1CT 1ENCOD",[K(6,6)]:"xFLEXIBLES",[K(22,6)]:"0%"});
 return {D,N};
}

/* ---------- Estado ---------- */
let T={};            // id -> {done,note,pending}
let H=[];            // historial (más reciente primero)
let tab="res",sel=null,uid=null,isAdmin=false,ready=false,fromCache=true,online=navigator.onLine,pendingN=0,fatal=null,seedErr=null;
let NAME=localStorage.getItem("tecnico")||"";
let A=[],draft="",draftW="";
let aTipo="acta",draftC="",draftS="Mayor",draftPh=[],aFil="all",PH={},PHshow={},PHload={};
let WX=null,WXat=0,WXerr="";
try{const c=JSON.parse(localStorage.getItem("wx2")||"null");if(c&&c.j){WX=c.j;WXat=c.at}}catch(e){}
let MI=+(localStorage.getItem("miwtg")||0),mapS=0;
let P=[],pzOnly=true,pzD={pieza:"",don:"",rcv:"",obs:""};
const done=k=>!!(T[k]&&T[k].done), note=k=>T[k]&&T[k].note;
const wp=w=>{let n=0;for(let s=1;s<=NS;s++)n+=done(K(w,s))?1:0;return n};
const sp=s=>{let n=0;for(let w=1;w<=NW;w++)n+=done(K(w,s))?1:0;return n};
const tot=()=>{let n=0;for(const k in T)if(T[k].done)n++;return n};
const col=p=>p>=100?"var(--ok)":p>=70?"#84cc16":p>=40?"#f59e0b":p>0?"#f97316":"var(--pe)";
const canEdit=()=>ready&&uid&&NAME;
const fmt=d=>d?d.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"…";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(m,ok){const t=$("toast");t.style.background=ok?"var(--ok)":"";t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",5000)}

/* ---------- Firebase ---------- */
if(firebaseConfig.apiKey.startsWith("PEGAR")){
 document.body.innerHTML='<div class="card" style="margin-top:30px"><h2>⚙️ Falta configurar Firebase</h2><p>Abrí <b>firebase-config.js</b> y pegá la configuración de tu proyecto de Firebase. Seguí la guía del README.</p></div>';
 throw new Error("Firebase sin configurar");
}
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const tasksCol=collection(db,...PROJ,"tasks");
const histCol=collection(db,...PROJ,"history");
const actaCol=collection(db,...PROJ,"acta");
const sisCol=collection(db,...PROJ,"sistemas");
const piezasCol=collection(db,...PROJ,"piezas");
const fotosCol=collection(db,...PROJ,"fotos");

onAuthStateChanged(auth,async u=>{
 if(!u){try{await signInAnonymously(auth)}catch(e){fatal=e.code==="auth/operation-not-allowed"?"Habilitá la autenticación anónima en Firebase (Authentication → Sign-in method).":"No se pudo iniciar sesión: "+e.message;render()}return}
 uid=u.uid;
 try{isAdmin=(await getDoc(doc(db,"admins",uid))).exists()}catch(e){isAdmin=false}
 start();
});

let started=false;
function start(){
 if(started){render();return}started=true;
 onSnapshot(tasksCol,{includeMetadataChanges:true},snap=>{
  const m={};let p=0;
  snap.forEach(d=>{const x=d.data({serverTimestamps:"estimate"});m[d.id]={done:!!x.done,note:x.note||"",pending:d.metadata.hasPendingWrites};if(d.metadata.hasPendingWrites)p++});
  T=m;pendingN=p;fromCache=snap.metadata.fromCache;ready=true;render(true);
  if(!snap.metadata.fromCache&&snap.size===0)seed();
 },e=>{fatal=e.code==="permission-denied"?"Sin permisos. Revisá las reglas de Firestore y que la autenticación anónima esté activa.":"Error de sincronización: "+e.message;render()});
 onSnapshot(query(histCol,orderBy("at","desc"),limit(300)),{includeMetadataChanges:true},snap=>{
  H=snap.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"})}));render(true)
 },()=>{});
 onSnapshot(query(actaCol,orderBy("at","desc"),limit(500)),{includeMetadataChanges:true},snap=>{
  A=snap.docs.map(d=>({id:d.id,pending:d.metadata.hasPendingWrites,...d.data({serverTimestamps:"estimate"})}));render(true)
 },()=>{});
 /* Tareas (sistemas) extra agregadas por los técnicos: ids 23, 24, ... */
 onSnapshot(sisCol,snap=>{
  const ex=snap.docs.map(d=>({n:+d.id,name:String(d.data().name||"")})).filter(x=>x.n>=23);
  S=[...BASE];ex.forEach(x=>{S[x.n-1]=x.name});
  for(let i=0;i<S.length;i++)if(!S[i])S[i]="TAREA "+(i+1);
  NS=S.length;render(true)
 },()=>{});
 onSnapshot(query(piezasCol,orderBy("at","desc"),limit(500)),{includeMetadataChanges:true},snap=>{
  P=snap.docs.map(d=>({id:d.id,pending:d.metadata.hasPendingWrites,...d.data({serverTimestamps:"estimate"})}));render(true)
 },()=>{});
 seedPiezas();
}

/* Carga inicial: una sola vez. La transacción verifica meta/init, así que abrir la app nunca reinicia nada. */
async function seed(){
 try{
  const {D,N}=seedData();
  await runTransaction(db,async tx=>{
   const init=doc(db,...PROJ,"meta","init");
   if((await tx.get(init)).exists())return;
   for(let w=1;w<=NW;w++)for(let s=1;s<=BASE.length;s++){const k=K(w,s);
    tx.set(doc(tasksCol,k),{w,s,sys:BASE[s-1],done:!!D[k],note:N[k]||"",by:null,byName:"Carga inicial (pizarra)",at:serverTimestamp()})}
   tx.set(init,{at:serverTimestamp(),by:uid});
  });
  seedErr=null;
 }catch(e){seedErr="No se pudo cargar los datos iniciales: "+e.message;render()}
}

/* ---------- Escritura: una tarea por vez, con historial, sin botones de guardar ---------- */
function setTask(w,s,target,prevOverride,noteArg){
 if(!canEdit())return;
 const k=K(w,s),prev=prevOverride??done(k),b=writeBatch(db),hn=noteArg!==undefined;
 b.set(doc(tasksCol,k),{w,s,done:target,...(hn?{note:noteArg}:{}),by:uid,byName:NAME,at:serverTimestamp()},{merge:true});
 b.set(doc(histCol),{w,s,sys:S[s-1],done:target,prev,...(hn&&noteArg?{note:noteArg}:{}),by:uid,byName:NAME,at:serverTimestamp()});
 // Con persistencia offline el commit se resuelve cuando el servidor confirma; mientras tanto la celda muestra "pendiente".
 b.commit().catch(e=>toast(e.code==="permission-denied"?"❌ Sin permiso: el cambio NO se guardó":"❌ El cambio no se guardó: "+e.message));
}
window.tg=(w,s)=>{if(!canEdit()){if(!NAME)openUser();return}
 const k=K(w,s);if(done(k)||note(k))openObs(w,s);else setTask(w,s,true)};
/* Segundo toque sobre un casillero verde → observación con nota. Sobre una observación → editar / completar / quitar. */
window.openObs=(w,s)=>{const k=K(w,s),cur=note(k)||"",ed=!done(k)&&!!cur;
 $("mub").innerHTML=`<h2>WTG ${pad(w)} · ${esc(S[s-1])}</h2><div class="sub">${ed?"Esta tarea tiene una observación. Podés editarla, marcarla como completa o quitarla.":"La tarea está completa. Si hay algo para observar, escribilo (pasa a “con observación”)."}</div><textarea id="obt" maxlength="200" rows="3" placeholder="Ej: falta torque en bridas, pendiente repuesto…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;box-sizing:border-box">${esc(cur)}</textarea><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><button class="btn pri" onclick="obsSave(${w},${s})">Guardar observación</button>${ed?`<button class="btn" onclick="obsDone(${w},${s})">✓ Marcar completo</button><button class="btn" onclick="obsClear(${w},${s})">Quitar observación (queda pendiente)</button>`:""}<button class="btn" onclick="$m()">Cancelar</button></div>`;
 $("mu").style.display="flex";setTimeout(()=>{const t=$("obt");if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}},60)};
window.obsSave=(w,s)=>{const v=($("obt").value||"").trim();if(!v){toast("Escribí la observación");return}$m();setTask(w,s,false,undefined,v)};
window.obsDone=(w,s)=>{$m();setTask(w,s,true,undefined,"")};
window.obsClear=(w,s)=>{$m();setTask(w,s,false,undefined,"")};
window.revert=id=>{const h=H.find(x=>x.id===id);if(!h||!isAdmin)return;if(confirm(`¿Volver WTG ${pad(h.w)} · ${h.s>0&&S[h.s-1]?S[h.s-1]:h.sys} a "${h.prev?"completo":"pendiente"}"?`))setTask(h.w,h.s,h.prev)};

window.restoreAll=async()=>{
 if(!isAdmin||!confirm("⚠️ Esto vuelve TODAS las tareas a los datos originales de la pizarra. Queda registrado en el historial. ¿Continuar?"))return;
 if(!navigator.onLine){toast("Necesitás conexión para restaurar");return}
 try{
  const {D,N}=seedData();let b=writeBatch(db),n=0;
  const flush=async()=>{await b.commit();b=writeBatch(db);n=0};
  for(let w=1;w<=NW;w++)for(let s=1;s<=BASE.length;s++){const k=K(w,s);
   b.set(doc(tasksCol,k),{w,s,done:!!D[k],note:N[k]||"",by:uid,byName:NAME+" (restauración)",at:serverTimestamp()},{merge:true});
   if(++n>=100)await flush()}
  b.set(doc(histCol),{w:0,s:0,sys:"TODO",done:false,prev:false,restore:true,by:uid,byName:NAME,at:serverTimestamp()});
  await flush();toast("✅ Datos originales restaurados");
 }catch(e){toast("❌ No se pudo restaurar: "+e.message)}
};

/* ---------- Usuario ---------- */
window.openUser=()=>{
 $("mub").innerHTML=`<h2>👤 ¿Quién sos?</h2><div class="sub">Tu nombre queda en el historial junto a cada cambio.</div>
 <input id="nm" placeholder="Nombre del técnico" value="${esc(NAME)}" maxlength="30">
 <div class="sub">Tu ID: <code>${esc(uid||"…")}</code>${isAdmin?"Sos <b>administrador</b>.":"Para ser administrador, agregá este ID en la colección <b>admins</b> (ver README)."}</div>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="$m(0)">Cerrar</button><button class="btn" style="background:var(--ac);color:#fff;border-color:var(--ac)" onclick="saveName()">Guardar</button></div>`;
 $("mu").style.display="flex";setTimeout(()=>$("nm")&&$("nm").focus(),50)};
window.$m=()=>{$("mu").style.display="none";$("mu").classList.remove("wide");OPENID=null};
$("mu").addEventListener("click",e=>{if(e.target===$("mu"))$m()});
window.saveName=()=>{const v=$("nm").value.trim();if(!v)return;NAME=v;localStorage.setItem("tecnico",v);$m();render(true)};

/* ---------- Conexión ---------- */
addEventListener("online",()=>{online=true;render(true)});addEventListener("offline",()=>{online=false;render(true)});

function status(){
 if(fatal)return["er","Error"];
 if(!online)return["of","Sin conexión"+(pendingN?` · ${pendingN} pendiente${pendingN>1?"s":""}`:"")];
 if(!ready)return["sy","Conectando…"];
 if(pendingN)return["sy",`Sincronizando ${pendingN}…`];
 if(fromCache)return["sy","Conectando…"];
 return["ok","En vivo"];
}

/* ---------- Vistas (mismo diseño de la app original) ---------- */
const bar=p=>`<div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div>`;
function ring(p){const r=62,c=2*Math.PI*r;return `<div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--pe)" stroke-width="16"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${p>=100?"var(--ok)":"var(--ac)"}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg><b>${p.toFixed(1)}%<small>avance total</small></b></div>`}


/* ---------- Clima (Open-Meteo, gratis y sin clave) + Novedades ---------- */
const WX_LAT=-36.961622,WX_LON=-60.497199;       // PE Olavarría: punto del parque marcado en Google Maps
const WX_CAUT=10,WX_STOP=17;                       // m/s a 100 m: precaución / suspender trabajos en altura. REFERENCIA ORIENTATIVA: manda el procedimiento de seguridad del proyecto.
const WX_URL=`https://api.open-meteo.com/v1/forecast?latitude=${WX_LAT}&longitude=${WX_LON}&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=wind_speed_100m,wind_direction_100m,wind_gusts_10m,weather_code,temperature_2m,precipitation_probability&wind_speed_unit=ms&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=3`;
async function loadWx(){
 try{const r=await fetch(WX_URL,{cache:"no-store"});if(!r.ok)throw new Error(r.status);const j=await r.json();if(!j.hourly||!j.current)throw new Error("formato");
  WX=j;WXat=Date.now();WXerr="";try{localStorage.setItem("wx2",JSON.stringify({j,at:WXat}))}catch(e){}}
 catch(e){WXerr=WX?"No se pudo actualizar (se muestran los últimos datos).":"No se pudo cargar el clima (sin conexión o bloqueado en esta red)."}
 if(tab==="nov"||WXlvlNow()===2)render(true)}
const DIRS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const dirName=d=>DIRS[Math.round(((d%360)+360)%360/22.5)%16];
const wxIcon=c=>c==null?"❔":c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=77?"❄️":c<=82?"🌦️":c<=86?"❄️":"⛈️";
const wxTxt=c=>c==null?"":c===0?"Despejado":c<=2?"Poco nublado":c===3?"Nublado":c<=48?"Niebla":c<=57?"Llovizna":c<=67?"Lluvia":c<=77?"Nieve":c<=82?"Chaparrones":c<=86?"Nieve":"Tormenta";
function wxLvl(v,g,c){const e=Math.max(v||0,g||0);return (c>=95||e>=WX_STOP)?2:(e>=WX_CAUT||c>=61)?1:0}
const LV=[["Condiciones buenas","var(--ok)"],["Precaución","#f59e0b"],["Suspender trabajos en altura","var(--er)"]];
function wxNowIdx(){if(!WX)return -1;const cur=String(WX.current.time).slice(0,13);const i=WX.hourly.time.findIndex(t=>t.startsWith(cur));return i<0?0:i}
function wxNow(){if(!WX)return null;const i=wxNowIdx(),h=WX.hourly,c=WX.current;
 return {v:h.wind_speed_100m[i],d:h.wind_direction_100m[i],g:Math.max(h.wind_gusts_10m[i]||0,c.wind_gusts_10m||0),v10:c.wind_speed_10m,t:c.temperature_2m,code:c.weather_code,pp:h.precipitation_probability[i]}}
function WXlvlNow(){const n=wxNow();return n?wxLvl(n.v,n.g,n.code):0}
function wxScene(n){
 const ms=n.v,stop=ms>=25,per=ms<3||stop?0:Math.max(2.2,60/Math.min(14,ms*1.3));
 const sd=Math.max(.9,5-n.v/3.3).toFixed(1),rain=n.code>=51&&n.code<=99;
 const blade=a=>`<path d="M130 52 L127.6 15 Q130 11 132.4 15 Z" fill="var(--ac)" transform="rotate(${a} 130 52)"/>`;

 const now=new Date(),by={},wt=new Set(),det={};let c=0,u=0;
 H.forEach(h=>{if(h.restore||h.nueva)return;const d=toD(h)||(h.pending?now:null);if(!d||d.toDateString()!==now.toDateString())return;
  if(h.done){c++;by[h.byName||"—"]=(by[h.byName||"—"]||0)+1;wt.add(h.w);(det[h.w]=det[h.w]||new Set()).add(S[h.s-1]||"Sistema "+h.s)}else u++});
 return {c,u,by,det,wt:[...wt].sort((a,b)=>a-b)}}
const faltan=w=>S.map((n,i)=>done(K(w,i+1))?null:n).filter(Boolean);

function miWtg(){

 let h=`<div class="card"><h2>📍 Mi WTG</h2><select onchange="setMi(this.value)" style="margin-bottom:${MI?10:0}px">${opts}</select>`;
 if(MI){const p=Math.round(wp(MI)/NS*100),f=faltan(MI),pz=pp(MI);
  h+=`<div class="row" style="margin:0 0 10px"><b style="width:auto">${p}%</b>${bar(p)}<span class="p" style="width:auto">${wp(MI)}/${NS}</span></div>`;
  if(!f.length)h+=`<div class="tl" style="color:var(--ok);font-weight:700">🎉 Sistemas completos${pz?` · pero tiene ${pz} pieza${pz>1?"s":""} sin reponer 🔧`:""}</div>`;
  else h+=`<div class="tl">Faltan <b>${f.length}</b>${pz?` · 🔧 ${pz} pieza${pz>1?"s":""} sin reponer`:""}. Tocá para marcar:</div>`;
  h+=`<div class="chips">`+S.map((n,i)=>({n,i,d:done(K(MI,i+1))})).sort((a,b)=>a.d-b.d).map(({n,i,d})=>{const k=K(MI,i+1);return `<button class="chip big ${d?"d":note(k)?"n":""} ${T[k]&&T[k].pending?"p":""}" onclick="tg(${MI},${i+1})">${d?"✓ ":""}${n}${!d&&note(k)?" · "+esc(note(k)):""}</button>`}).join("")+`</div><div style="margin-top:10px"><button class="btn" onclick="goWtg(${MI})">Ver ficha completa (piezas y acta)</button></div>`}
 return h+`</div>`}
function hoyCard(){
 const a=hoyStats(),ac=A.filter(x=>{const d=toD(x)||(x.pending?new Date():null);return d&&d.toDateString()===new Date().toDateString()}).length;

 return `<div class="card"><h2>📅 Hoy</h2><div class="hero2"><div class="kpi"><b style="color:var(--ok)">${a.c}</b><span>tareas completadas</span></div><div class="kpi"><b>${a.wt.length}</b><span>WTG con avance</span></div><div class="kpi"><b>${ac}</b><span>registros de acta</span></div></div>`+
  (a.c?`<div class="tl">${who}</div>${a.wt.map(w=>`<div class="tl" style="margin:2px 0"><b>WTG ${pad(w)}</b>: ${[...a.det[w]].map(esc).join(", ")}</div>`).join("")}${a.u?`<div class="tl" style="margin:0">↩ ${a.u} desmarcada${a.u>1?"s":""}</div>`:""}`:`<div class="sub" style="margin:0">Todavía no se marcó nada hoy.</div>`)+`<div style="margin-top:10px"><button class="btn pri" onclick="copiarParte()">📋 Copiar parte del día</button> <button class="btn" onclick="openDayRep()">📄 Reporte con gráficos</button> <span class="sub" style="margin-left:6px">para pegar en WhatsApp</span></div></div>`}
function cercaCard(){
 const L=[];for(let w=1;w<=NW;w++){const f=faltan(w),q=f.length+pp(w);if(q>0&&wp(w)>0)L.push([w,f,q])}
 L.sort((a,b)=>a[2]-b[2]||a[0]-b[0]);if(!L.length)return "";
 return `<div class="card"><h2>🏁 Más cerca de cerrar</h2>`+L.slice(0,5).map(([w,f,q])=>{const p=Math.round(wp(w)/NS*100);return `<div style="cursor:pointer;margin:8px 0" onclick="goWtg(${w})"><div class="row" style="margin:0"><span class="n" style="width:70px">WTG ${pad(w)}</span>${bar(p)}<span class="p" style="width:70px">${q} falta${q>1?"n":""}</span></div><div class="sub" style="margin:2px 0 0 78px;font-size:12px">${f.slice(0,3).map(esc).join(", ")}${f.length>3?` +${f.length-3}`:""}${pp(w)?` · 🔧${pp(w)} pieza${pp(w)>1?"s":""}`:""}</div></div>`}).join("")+`</div>`}
window.copiarParte=async()=>{
 const t=tot(),tt=NW*NS,a=hoyStats(),now=new Date();let full=0;for(let w=1;w<=NW;w++)if(wp(w)==NS)full++;
 const L=[`📊 *PARTE DE COMMISSIONING*`,`PE Olavarria PCR · ${now.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}`,""];
 L.push(`✅ *TAREAS REALIZADAS HOY* (${a.c})`);
 if(a.c){a.wt.forEach(w=>L.push(`• WTG ${pad(w)}: ${[...a.det[w]].join(", ")}`));L.push("Por técnico: "+Object.entries(a.by).map(([n,c])=>`${n} (${c})`).join(", "))}
 else L.push("Todavía no se marcó nada hoy.");
 if(a.u)L.push(`↩ ${a.u} tarea${a.u>1?"s":""} desmarcada${a.u>1?"s":""} hoy`);
 const ah=A.filter(x=>{const d=toD(x);return d&&d.toDateString()===now.toDateString()}).reverse();
 if(ah.length){L.push("",`📝 *ACTA DE HOY* (${ah.length})`);ah.forEach(x=>L.push(`• ${hhmm(toD(x))} ${x.byName||""}${x.wtg?" (WTG "+x.wtg+")":""}${isDano(x)?" ⚠️ DAÑO":""}: ${String(x.text).replace(/\s+/g," ")}`))}
 L.push("",`📈 *AVANCE*`,`Avance total: *${(t/tt*100).toFixed(1)}%* (${t}/${tt})`,`WTG al 100%: ${full}/${NW}`);
 const cl=[];for(let w=1;w<=NW;w++){const f=faltan(w),q=f.length+pp(w);if(q>0&&wp(w)>0)cl.push([w,f,q])}
 cl.sort((x,y)=>x[2]-y[2]||x[0]-y[0]);
 if(cl.length){L.push("","🏁 Más cerca de cerrar:");cl.slice(0,5).forEach(([w,f,q])=>L.push(`• WTG ${pad(w)}: faltan ${f.join(", ")}${pp(w)?` + ${pp(w)} pieza(s)`:""}`))}
 const pend=P.filter(x=>!x.repuesta);
 if(pend.length){L.push("",`🔧 Piezas sin reponer (${pend.length}):`);const by={};pend.forEach(x=>{(by[x.don]=by[x.don]||[]).push(x)});
  Object.keys(by).sort((x,y)=>by[y].length-by[x].length).forEach(w=>{const old=Math.max(...by[w].map(x=>dias(toD(x))));L.push(`• WTG ${pad(w)}: ${by[w].map(x=>x.pieza).join("; ")}${old>=3?` (${old} d)`:""}`)})}
 const sin=S.filter((n,i)=>sp(i+1)==0);if(sin.length)L.push("",`🚧 *SIN INICIAR*: ${sin.join(", ")}`);
 const txt=L.join("\n");
 try{await navigator.clipboard.writeText(txt);toast("✅ Parte copiado. Pegalo en WhatsApp.",true)}
 catch(e){try{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(ok){toast("✅ Parte copiado. Pegalo en WhatsApp.",true);return}}catch(e2){}
  $("mub").innerHTML=`<h2>Parte del día</h2><textarea id="ptx" rows="12" style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:12px/1.4 inherit">${esc(txt)}</textarea><div style="text-align:right;margin-top:8px"><button class="btn" onclick="$m()">Cerrar</button></div>`;$("mu").style.display="flex";setTimeout(()=>{const x=$("ptx");x&&x.select()},50)}};
function cardsRes(){const t=tot(),p=t/(NW*NS)*100;let full=0,none=[];
 for(let w=1;w<=NW;w++)if(wp(w)==NS)full++;
 S.forEach((n,i)=>{if(sp(i+1)==0)none.push(n)});
 let hero=`<div class="card hero">${ring(p)}<div class="kpis"><div class="kpi"><b style="color:var(--ok)">${t}</b><span>completos</span></div><div class="kpi"><b>${(NW*NS)-t}</b><span>pendientes</span></div><div class="kpi"><b>${full}/${NW}</b><span>WTG al 100%</span></div></div></div>`;let h="";
 h+=fold("mi",miniMi(),miWtg(),true)+fold("hoy",miniHoy(),hoyCard(),false)+fold("cerca",miniCerca(),cercaCard(),false);
 if(none.length)h+=fold("none",miniNone(none),`<div class="card"><h2>🚧 Sistemas sin iniciar</h2><div class="chips">${none.map(n=>`<span class="chip n">${n}</span>`).join("")}</div></div>`,false);
 const pt=ppTot();
 if(pt){const by={},old={};P.forEach(x=>{if(!x.repuesta){by[x.don]=(by[x.don]||0)+1;old[x.don]=Math.max(old[x.don]||0,dias(toD(x)))}});
  h+=fold("pz",miniPz(),`<div class="card"><h2>🔧 Piezas pendientes de reposición · ${pt}</h2><div class="chips">`+Object.keys(by).sort((a,b)=>by[b]-by[a]||a-b).map(w=>`<button class="chip n" onclick="goWtg(${w})">WTG ${pad(w)} · ${by[w]}${old[w]>=7?` <span class="age" style="color:${old[w]>=14?"var(--er)":"var(--nt)"}">${old[w]} d</span>`:""}</button>`).join("")+`</div><div class="sub" style="margin:8px 0 0">La WTG donante queda con la pieza pendiente hasta que se marque "Repuesta" en la pestaña Piezas.</div></div>`,false)}
 const pend=[];for(let w=1;w<=NW;w++){const q=(NS-wp(w))+pp(w);if(q>0)pend.push([w,q])}
 pend.sort((a,b)=>b[1]-a[1]||a[0]-b[0]);
 if(pend.length)h+=fold("pend",miniPend(),`<div class="card"><h2>📌 WTG con más pendientes</h2>`+pend.slice(0,8).map(([w,q])=>`<div class="row" style="cursor:pointer" onclick="goWtg(${w})"><span class="n">WTG ${pad(w)}</span><div class="bar"><i style="width:${Math.min(100,Math.round(q/NS*100))}%;background:var(--nt)"></i></div><span class="p" style="width:96px">${q} pend.${pp(w)?` (🔧${pp(w)})`:""}</span></div>`).join("")+`<div class="sub" style="margin:8px 0 0">Tocá una WTG para ver sus sistemas pendientes, piezas y acta. Incluye las piezas extraídas sin reponer (🔧).</div></div>`,false);
 h+=fold("sys",miniSys(),`<div class="card"><h2>Avance por sistema</h2>`+S.map((n,i)=>{const q=sp(i+1)/NW*100;return `<div class="row"><span class="n">${n}</span>${bar(q)}<span class="p">${Math.round(q)}%</span></div>`}).join("")+`</div>`,false);
 return hero+`<div class="tb"><button class="btn" onclick="cxAll(true)">⤢ Expandir todo</button><button class="btn" onclick="cxAll(false)">⤡ Minimizar todo</button></div><div class="gr">`+fold("pan",miniPan(),panCard(),true,true)+h+`</div>`}

const DAYL=["D","L","M","M","J","V","S"];
function actDays(){const out=[];const now=new Date();for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);out.push({d,c:0})}
 H.forEach(h=>{if(h.restore||h.nueva||!h.done)return;const t=toD(h)||(h.pending?now:null);if(!t)return;const o=out.find(x=>x.d.toDateString()===t.toDateString());if(o)o.c++});return out}
function colsChart(days,h){const mx=Math.max(1,...days.map(x=>x.c));return `<div class="cols" style="${h?`height:${h}px;flex:none`:""}">${days.map((x,i)=>`<div class="col" title="${x.d.toLocaleDateString("es-AR")}: ${x.c}"><em>${x.c||""}</em><div class="trk"><i style="height:${Math.max(x.c?6:0,x.c/mx*100)}%;background:${i==days.length-1?"var(--ac)":"color-mix(in srgb,var(--ac) 55%,var(--pe))"}"></i></div><b>${DAYL[x.d.getDay()]}</b></div>`).join("")}</div>`}

 const arc=(x1,x2,c)=>{const [ax,ay]=a(x1),[bx,by]=a(x2);return `<path d="M${ax} ${ay} A70 70 0 0 1 ${bx} ${by}" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="butt"/>`};

function photoBlock(a){

async function shrink(file){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  let max=1280,q=.72,out,w,h;
  for(let t=0;t<7;t++){const sc=Math.min(1,max/Math.max(img.width,img.height));w=Math.max(1,Math.round(img.width*sc));h=Math.max(1,Math.round(img.height*sc));
   const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);out=c.toDataURL("image/jpeg",q);
   if(out.length<=330000)break;max*=.85;q=Math.max(.45,q-.05)}
  if(out.length>420000)throw new Error("grande");
  return {data:out,w,h}}finally{URL.revokeObjectURL(url)}}

  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+n}

 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdl,true);e.setUint32(16,off,true);

window.pzAdd=()=>{
 if(!canEdit()){if(!NAME)openUser();return}
 const pieza=pzD.pieza.trim(),don=parseInt(pzD.don,10),rcv=String(pzD.rcv||"").trim();
 if(!pieza||!don||!rcv){toast("Completá la pieza, la WTG donante y quién recibe");return}
 if(/^\d+$/.test(rcv)&&+rcv===don){toast("La WTG donante y la que recibe no pueden ser la misma");return}
 const nz=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
 const np=nz(pieza),rn=nz(rcv);
 const wl=v=>/^\d+$/.test(String(v))?"WTG "+pad(+v):v;
 const dup=P.filter(x=>{const n=nz(x.pieza);return n&&(n===np||n.includes(np)||np.includes(n))});
 if(dup.length){
  const sd=dup.filter(x=>x.don===don),sr=dup.filter(x=>nz(x.rcv)===rn&&!sd.includes(x));
  const otros=dup.filter(x=>!sd.includes(x)&&!sr.includes(x));
  const L=x=>`  • ${x.pieza}: ${wl(x.don)} → ${wl(x.rcv)} (${x.repuesta?"repuesta":"pendiente"}${x.byName?", "+x.byName:""})`;
  let m="⚠️ Posible consumo repetido de \""+pieza+"\"\n";
  if(sd.length)m+=`\nYa se sacó de la WTG ${pad(don)}:\n`+sd.slice(0,4).map(L).join("\n")+"\n";
  if(sr.length)m+=`\nYa se entregó a ${wl(rcv)}:\n`+sr.slice(0,4).map(L).join("\n")+"\n";
  if(!sd.length&&!sr.length)m+="\nYa hay piezas parecidas registradas:\n"+otros.slice(0,4).map(L).join("\n")+"\n";
  m+="\n¿Querés registrarla igual?";
  if(!confirm(m))return;
 }
 const b=writeBatch(db);
 b.set(doc(piezasCol),{pieza,don,rcv,obs:pzD.obs.trim(),repuesta:false,by:uid,byName:NAME,at:serverTimestamp()});
 b.commit().catch(e=>toast(e.code==="permission-denied"?"❌ Sin permiso: la pieza NO se guardó":"❌ La pieza no se guardó: "+e.message));
 pzD={pieza:"",don:"",rcv:"",obs:""};render()};

const ser=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v&&typeof v.toDate==="function"?v.toDate().toISOString():v]));
const fdt=iso=>iso?new Date(iso).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):"";
async function gather(){
 const get=async q=>(await getDocs(q)).docs.map(d=>({id:d.id,...ser(d.data())}));
 const [tareas,sistemas,piezas,acta,historial]=await Promise.all([get(tasksCol),get(sisCol),get(query(piezasCol,orderBy("at","asc"))),get(query(actaCol,orderBy("at","asc"))),get(query(histCol,orderBy("at","asc")))]);
 return {tareas,sistemas,piezas,acta,historial}}
function buildSheets(g){
 const tm={};g.tareas.forEach(t=>{tm[t.id]=t});
 const mat=[["WTG",...S,"Completos","% avance","Piezas pendientes"]];
 for(let w=1;w<=NW;w++){const row=["WTG "+pad(w)];let c=0;
  for(let q=1;q<=NS;q++){const t=tm[K(w,q)];if(t&&t.done){row.push("✓");c++}else row.push(t&&t.note?t.note:"")}
  row.push(c,Math.round(c/NS*100)+"%",g.piezas.filter(x=>x.don===w&&!x.repuesta).length);mat.push(row)}
 const tr=["% por sistema"];for(let q=1;q<=NS;q++){let c=0;for(let w=1;w<=NW;w++)if(tm[K(w,q)]&&tm[K(w,q)].done)c++;tr.push(Math.round(c/NW*100)+"%")}
 mat.push(tr);
 const piezas=[["Pieza","WTG donante","Recibe","Estado","Observaciones","Cargó","Fecha","Repuesta por","Fecha reposición"]].concat(g.piezas.map(x=>[x.pieza,"WTG "+pad(x.don),/^\d+$/.test(String(x.rcv))?"WTG "+pad(+x.rcv):x.rcv,x.repuesta?"Repuesta":"Pendiente",x.obs||"",x.byName||"",fdt(x.at),x.repByName||"",fdt(x.repAt)]));
 const acta=[["Fecha","Tipo","Técnico","WTG","Componente","Severidad","Fotos","Registro"]].concat(g.acta.map(a=>[fdt(a.at),a.tipo==="dano"?"DAÑO":"Acta",a.byName||"",a.wtg||"",a.comp||"",a.sev||"",a.nfotos||0,a.text]));
 const hist=[["Fecha","Técnico","Cambio"]].concat(g.historial.map(h=>[fdt(h.at),h.byName||"",h.restore?"Restauró los datos originales":h.nueva?"Nueva tarea: "+h.sys:`WTG ${pad(h.w)} · ${h.s>0&&S[h.s-1]?S[h.s-1]:h.sys} → ${h.done?"completo":"pendiente"}`]));
 return {"Matriz de avance":mat,"Piezas":piezas,"Acta":acta,"Historial":hist}}

/* Detecta a qué WTG se refiere un registro: campo "WTG involucrados" + menciones "WTG 13", "WTG 5, 7 y 13" en el texto */
function actaWtgs(a){
 const set=new Set();
 (String(a.wtg||"").match(/\d{1,2}/g)||[]).forEach(n=>set.add(+n));
 const re=/wtg'?s?\s*((?:\d{1,2}(?:\s*(?:,|y|e|\/|&)\s*)?)+)/gi;let m;
 while((m=re.exec(String(a.text||"")))){(m[1].match(/\d{1,2}/g)||[]).forEach(n=>set.add(+n))}
 return set}
